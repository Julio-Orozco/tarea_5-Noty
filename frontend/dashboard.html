<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Noty</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="images/noty-favicon.png">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="dashboard-page">
  <!-- ===== MODAL PERSONALIZADO ===== -->
  <div id="customModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3 id="modalTitle" class="modal-title">
        <span id="modalTitleIcon" class="modal-title-icon"></span>
        <span id="modalTitleText">¡Atención!</span>
      </h3>
      <p id="modalMessage" class="modal-message">El título y el contenido son obligatorios.</p>
      <div id="modalButtonsContainer" class="modal-buttons">
        <button id="modalButton" class="modal-button">Entendido</button>
      </div>
    </div>
  </div>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div>
          <h1 style="font-size: 2.2rem; margin: 0; display: flex; align-items: center; gap: 12px;">
            <i class="ph-bold ph-notebook"></i>
            Noty
          </h1>
          <p style="font-size: 0.8rem; color: var(--muted); margin: 0; text-transform: uppercase; letter-spacing: 0.5px;">Gestión de Notas</p>
        </div>
      </div>

      <button id="newNoteButton" class="button primary full-width" type="button">Nueva nota</button>
      <div id="notesList" class="notes-list" aria-label="Lista de notas"></div>

      <!-- Botón Salir -->
      <div style="margin-top: auto; padding-top: 20px; display: flex; justify-content: flex-start;">
        <button id="logoutButton" class="button danger" type="button" title="Cerrar sesion" style="padding: 8px 40px; font-size: 0.9rem; width: auto;">Salir</button>
      </div>
    </aside>

    <main class="editor-panel">
      <div class="editor-topbar">
        <input id="noteTitle" class="title-input" type="text" placeholder="Titulo de la nota">
        <div class="editor-actions">
          <button id="saveNoteButton" class="button primary" type="button" onclick="window.NotyNotes.saveNote()">Guardar</button>
          <button id="deleteNoteButton" class="button danger" type="button" onclick="window.NotyNotes.deleteNote()">Eliminar</button>
          <button id="exportPdfButton" class="button secondary" type="button" onclick="window.NotyNotes.exportNoteToPdf()">Exportar PDF</button>
        </div>
      </div>

      <div class="toolbar" aria-label="Barra de formato">
        <button data-command="formatBlock" data-value="h1" type="button">H1</button>
        <button data-command="formatBlock" data-value="h2" type="button">H2</button>
        <button data-command="formatBlock" data-value="h3" type="button">H3</button>
        <button data-command="bold" type="button">B</button>
        <button data-command="italic" type="button">I</button>
        <button data-command="insertUnorderedList" type="button" title="Viñetas" class="toolbar-icon-btn">
          <i class="ph-bold ph-list-bullets"></i>
        </button>
        <button data-command="insertOrderedList" type="button" title="Numerada" class="toolbar-icon-btn">
          <i class="ph-bold ph-list-numbers"></i>
        </button>
        <button data-command="formatBlock" data-value="p" type="button">Párrafo</button>
      </div>

      <section id="noteEditor" class="note-editor" contenteditable="true" aria-label="Editor de contenido""></section>

      <p id="message" class="message success" role="status">Dashboard v4 cargado.</p>
    </main>
  </div>

  <script>
    // ==========================================
    // FUNCIONES DEL MODAL (disponibles globalmente)
    // ==========================================
    function showModal(message) {
      const modal = document.getElementById('customModal');
      const modalButtonsContainer = document.getElementById('modalButtonsContainer');
      const modalMessage = document.getElementById('modalMessage');
      const modalTitleText = document.getElementById('modalTitleText');
      const modalTitleIcon = document.getElementById('modalTitleIcon');
      
      modalTitleText.textContent = '¡Atención!';
      modalTitleIcon.innerHTML = '<i class="ph-bold ph-warning"></i>';
      modalMessage.textContent = message;
      
      // Mostrar solo un botón "Entendido"
      modalButtonsContainer.innerHTML = '<button id="modalButton" class="modal-button">Entendido</button>';
      document.getElementById('modalButton').addEventListener('click', function() {
        modal.style.display = 'none';
      });
      
      modal.style.display = 'flex';
    }

    function showConfirmModal(title, message, onConfirm, confirmText = "Confirmar", isDangerous = false) {
      const modal = document.getElementById('customModal');
      const modalTitleText = document.getElementById('modalTitleText');
      const modalTitleIcon = document.getElementById('modalTitleIcon');
      const modalMessage = document.getElementById('modalMessage');
      const modalButtonsContainer = document.getElementById('modalButtonsContainer');
      
      modalTitleText.textContent = title;
      modalMessage.textContent = message;
      
      // Cambiar icono según si es peligroso
      if (isDangerous) {
        modalTitleIcon.innerHTML = '<i class="ph-bold ph-trash"></i>';
      } else {
        modalTitleIcon.innerHTML = '<i class="ph-bold ph-warning"></i>';
      }
      
      // Crear botones de confirmación
      const cancelClass = isDangerous ? 'modal-button cancel' : 'modal-button';
      const confirmClass = isDangerous ? 'modal-button confirm danger' : 'modal-button confirm';
      
      modalButtonsContainer.innerHTML = `
        <button id="modalCancelButton" class="${cancelClass}">Cancelar</button>
        <button id="modalConfirmButton" class="${confirmClass}">${confirmText}</button>
      `;
      
      document.getElementById('modalCancelButton').addEventListener('click', () => {
        modal.style.display = 'none';
      });
      
      document.getElementById('modalConfirmButton').addEventListener('click', () => {
        onConfirm();
        modal.style.display = 'none';
      });
      
      modal.style.display = 'flex';
    }

    document.getElementById('customModal').addEventListener('click', function(e) {
      if (e.target === this) {
        this.style.display = 'none';
      }
    });

    // Exponer funciones globalmente
    window.showModal = showModal;
    window.showConfirmModal = showConfirmModal;

    // ==========================================
    // API Y CONFIGURACIÓN
    // ==========================================
    const API_BASE_URL = window.location.port === "3000"
      ? "/api"
      : "http://localhost:3000/api";
    const notesList = document.querySelector("#notesList");
    const noteTitle = document.querySelector("#noteTitle");
    const noteEditor = document.querySelector("#noteEditor");
    const messageElement = document.querySelector("#message");
    const newNoteButton = document.querySelector("#newNoteButton");
    const logoutButton = document.querySelector("#logoutButton");
    const toolbar = document.querySelector(".toolbar");

    let notes = [];
    let selectedNoteId = null;

    function showMessage(text, type = "info") {
      messageElement.textContent = text;
      messageElement.className = `message ${type}`;
    }

    function getToken() {
      return localStorage.getItem("noty_token");
    }

    function removeToken() {
      localStorage.removeItem("noty_token");
      localStorage.removeItem("noty_user");
    }

    async function apiRequest(path, options = {}) {
      const token = getToken();

      if (!token) {
        window.location.href = "login.html";
        throw new Error("Debes iniciar sesion.");
      }

      let response;

      try {
        response = await fetch(`${API_BASE_URL}${path}`, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
            ...(options.headers || {})
          }
        });
      } catch (error) {
        throw new Error("No se pudo conectar con el backend en http://localhost:3000.");
      }

      const responseText = await response.text();
      let data;

      try {
        data = JSON.parse(responseText);
      } catch (error) {
        throw new Error("La API no devolvio JSON. Abre la app desde http://localhost:3000/login.html y verifica que el backend este activo.");
      }

      if (!response.ok) {
        throw new Error(data.message || "Error inesperado en la API.");
      }

      return data;
    }

    function setEditor(note) {
      selectedNoteId = note ? note.id : null;
      noteTitle.value = note ? note.title : "";
      noteEditor.innerHTML = note ? note.content : "";
      renderNotesList();
    }

    function renderNotesList() {
      notesList.innerHTML = "";

      if (notes.length === 0) {
        notesList.innerHTML = '<p class="empty-state">No hay notas todavia.</p>';
        return;
      }

      notes.forEach((note) => {
        const button = document.createElement("button");
        button.className = note.id === selectedNoteId ? "note-item active" : "note-item";
        button.type = "button";

        const title = document.createElement("strong");
        title.textContent = note.title;

        const date = document.createElement("span");
        date.textContent = new Date(note.updated_at).toLocaleString();

        button.append(title, date);
        button.addEventListener("click", () => setEditor(note));
        notesList.appendChild(button);
      });
    }

    async function loadNotes() {
      try {
        notes = await apiRequest("/notes");
        setEditor(notes[0] || null);
        showMessage("Editor listo.", "success");
      } catch (error) {
        showMessage(error.message, "error");
      }
    }

    // ==========================================
    // FUNCIÓN SAVE NOTE CON VALIDACIÓN Y MODAL
    // ==========================================
    async function saveNote() {
      const title = noteTitle.value.trim();
      const content = noteEditor.innerHTML.trim();

      // Validaciones con modal
      if (!title && !content) {
        showModal("El título y el contenido son obligatorios.");
        return;
      }

      if (!title) {
        showModal("Debes agregar un título a la nota.");
        return;
      }

      if (!content) {
        showModal("Debes agregar contenido a la nota.");
        return;
      }

      // Si tiene título y contenido, guardar
      showMessage("Guardando nota...");

      try {
        if (selectedNoteId) {
          await apiRequest(`/notes/${selectedNoteId}`, {
            method: "PUT",
            body: JSON.stringify({ title, content })
          });
          showMessage("Nota actualizada correctamente.", "success");
        } else {
          const data = await apiRequest("/notes", {
            method: "POST",
            body: JSON.stringify({ title, content })
          });
          selectedNoteId = data.note.id;
          showMessage("Nota creada correctamente.", "success");
        }

        await loadNotes();
      } catch (error) {
        showMessage(error.message, "error");
      }
    }

    // ==========================================
    // ELIMINAR NOTA
    // ==========================================
    async function deleteNote() {
      if (!selectedNoteId) {
        showModal("Selecciona una nota antes de eliminar.");
        return;
      }

      showConfirmModal(
        "Eliminar nota",
        `¿Quieres eliminar la nota "${noteTitle.value}"? Esta acción no se puede deshacer.`,
        async () => {
          try {
            await apiRequest(`/notes/${selectedNoteId}`, { method: "DELETE" });
            showMessage("Nota eliminada correctamente.", "success");
            await loadNotes();
          } catch (error) {
            showMessage(error.message, "error");
          }
        },
        "Eliminar",
        true
      );
    }

    // ==========================================
    // EXPORTAR PDF
    // ==========================================
    function exportNoteToPdf() {
      if (!noteTitle.value.trim()) {
        showModal("Escribe un título antes de exportar.");
        return;
      }

      const printWindow = window.open("", "_blank");

      if (!printWindow) {
        showModal("El navegador bloqueó la ventana de impresión.");
        return;
      }

      printWindow.document.write(`
        <!DOCTYPE html>
        <html lang="es">
        <head>
          <meta charset="UTF-8">
          <title>${noteTitle.value}</title>
          <style>
            body { font-family: Arial, sans-serif; line-height: 1.6; margin: 32px; }
          </style>
        </head>
        <body>
          <h1>${noteTitle.value}</h1>
          <div>${noteEditor.innerHTML}</div>
        </body>
        </html>
      `);
      printWindow.document.close();
      
      // Cerrar la ventana automáticamente cuando el usuario termina de imprimir o cancela
      printWindow.addEventListener('afterprint', () => {
        printWindow.close();
      });
      
      printWindow.print();
      showMessage("Usa Guardar como PDF en la ventana de impresión.", "success");
    }

    // ==========================================
    // EVENTOS Y EXPOSICIÓN GLOBAL
    // ==========================================
    window.NotyNotes = {
      saveNote,
      deleteNote,
      exportNoteToPdf
    };

    toolbar.addEventListener("click", (event) => {
      const button = event.target.closest("button");

      if (!button) {
        return;
      }

      document.execCommand(button.dataset.command, false, button.dataset.value || null);
      noteEditor.focus();
    });

    newNoteButton.addEventListener("click", () => setEditor(null));

    logoutButton.addEventListener("click", () => {
      removeToken();
      window.location.href = "login.html";
    });

    if (!getToken()) {
      window.location.href = "login.html";
    } else {
      loadNotes();
    }
  </script>
</body>
</html>
